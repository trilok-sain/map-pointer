<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nearby Washrooms - Washroom Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 100%; min-height: 400px; }
  </style>
  
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">
 
    <header class="bg-green-600 text-white p-4 text-center font-semibold text-lg flex justify-between sticky top-0">
      <button class="block md:hidden p-2" id="menu-toggle">
        <!-- Heroicon: Menu (Outline) -->
        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <span>Nearby Washrooms</span>
      <span></span>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <aside id="mobile-menu" class="md:w-64 bg-white p-4 overflow-y-auto border-r border-gray-200 w-full  hidden md:block">
        
        <h2 class="float-left md:float-none font-semibold mb-4 text-green-700">Filters</h2>
        <form id="filters-form" class="space-y-4">
          <div>
            <label for="search-location" class="block font-medium mb-1">Search Location</label>
            <input type="text" id="search-location" name="searchLocation" placeholder="Enter location" class="w-full rounded border-gray-300 focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50 p-2" />
            <button type="button" id="search-btn" class="mt-2 w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">Search</button>
          </div>
          <div>
            <label for="range" class="block font-medium mb-1">Range (km)</label>
            <input type="number" id="range" name="range" min="1" max="50" value="5" class="w-full rounded border-gray-300 focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
          </div>
          <div>
            <span class="block font-medium mb-1">Accessibility</span>
            <label class="inline-flex items-center mr-4">
              <input type="checkbox" name="accessibility" value="wheelchair" class="form-checkbox" />
              <span class="ml-2">Wheelchair</span>
            </label>
            <label class="inline-flex items-center">
              <input type="checkbox" name="accessibility" value="baby" class="form-checkbox" />
              <span class="ml-2">Baby</span>
            </label>
          </div>
          <div>
            <span class="block font-medium mb-1">Type</span>
            <label class="inline-flex items-center mr-4">
              <input type="checkbox" name="type" value="free" class="form-checkbox" />
              <span class="ml-2">Free</span>
            </label>
            <label class="inline-flex items-center">
              <input type="checkbox" name="type" value="paid" class="form-checkbox" />
              <span class="ml-2">Paid</span>
            </label>
          </div>
          <div>
            <label for="rating" class="block font-medium mb-1">Minimum Rating</label>
            <select id="rating" name="rating" class="w-full rounded border-gray-300 focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50">
              <option value="0">Any</option>
              <option value="1">1 star</option>
              <option value="2">2 stars</option>
              <option value="3">3 stars</option>
              <option value="4">4 stars</option>
              <option value="5">5 stars</option>
            </select>
          </div>
          <button id="apply-filter" type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">Apply Filters</button>
        </form>
      </aside>
      <main class="flex-1 relative">
        <div id="map" class="h-full"></div>
      </main>
    </div>


  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const toggleBtn = document.getElementById('menu-toggle');
    const menu = document.getElementById('mobile-menu');
    const searchBtn = document.getElementById('search-btn');
    const applyFilter = document.getElementById('apply-filter');

    applyFilter.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });

    searchBtn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });

    toggleBtn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  </script>
</body>
</html>
