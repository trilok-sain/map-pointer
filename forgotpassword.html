<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password - Washroom Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-semibold mb-6 text-center text-green-700">Forgot Password</h1>
    <form id="forgot-password-form" class="space-y-4" novalidate>
      <div>
        <label for="fp-username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="fp-username" name="username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        <p class="text-red-600 text-sm mt-1 hidden" id="fp-username-error">Please enter your username.</p>
      </div>
      <div>
        <label for="fp-email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="fp-email" name="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        <p class="text-red-600 text-sm mt-1 hidden" id="fp-email-error">Please enter a valid email address.</p>
      </div>
      <div>
        <label for="fp-security-question" class="block text-sm font-medium text-gray-700">Security Question Answer</label>
        <input type="text" id="fp-security-question" name="securityQuestion" required minlength="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        <p class="text-red-600 text-sm mt-1 hidden" id="fp-security-question-error">Please enter the answer to your security question (min 5 characters).</p>
      </div>
      <div>
        <label for="fp-new-password" class="block text-sm font-medium text-gray-700">New Password</label>
        <input type="password" id="fp-new-password" name="newPassword" required minlength="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        <p class="text-red-600 text-sm mt-1 hidden" id="fp-new-password-error">New password must be at least 6 characters.</p>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">Reset Password</button>
    </form>
  </div>


  <script src="assets/js/main.js"></script>
</body>
</html>
